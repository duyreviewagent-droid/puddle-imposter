# Puddle Imposter on Render (free web service, WebSockets supported). The game + server live in web/.
services:
  - type: web
    name: puddle-imposter
    runtime: node
    plan: free
    rootDir: web
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
